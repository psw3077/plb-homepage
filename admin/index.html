<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PLB 관리자</title><style>:root{--bg:#071827;--panel:#10283a;--line:#27445a;--text:#f6f8fb;--muted:#a9bac8;--accent:#f39c34;--danger:#d9534f}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:linear-gradient(135deg,#071827,#0d2233);color:var(--text)}.wrap{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{padding:26px 18px;background:#05121d;border-right:1px solid var(--line)}.brand{font-size:28px;font-weight:800}.brand small{display:block;font-size:13px;color:var(--muted)}.nav{margin-top:28px;display:grid;gap:8px}.nav a{color:var(--text);text-decoration:none;padding:12px;border-radius:9px}.nav a:hover{background:var(--panel)}main{padding:30px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top a,.btn{border:0;border-radius:9px;padding:11px 14px;text-decoration:none;cursor:pointer;font-weight:700}.top a{color:#fff;border:1px solid var(--line)}.btn{background:var(--accent);color:#111}.btn.secondary{background:#1b4058;color:#fff}.btn.danger{background:var(--danger);color:#fff;padding:7px 10px}.notice{margin:20px 0;padding:15px;background:#142d3e;border-left:4px solid var(--accent);border-radius:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.card{padding:18px}.card b{display:block;font-size:28px}.card span{color:var(--muted)}.panel{padding:20px;margin-top:22px}.panel h2{margin-top:0}form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{display:grid;gap:6px;color:var(--muted);font-size:14px}.wide{grid-column:1/-1}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#081d2c;color:#fff;padding:11px}textarea{min-height:85px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:end}table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:22px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#1d455f;font-size:12px}@media(max-width:980px){.wrap{grid-template-columns:1fr}.side{border-right:0}.nav{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{padding:18px 12px}.top{align-items:flex-start;flex-direction:column}.nav{grid-template-columns:repeat(2,1fr)}.stats,form{grid-template-columns:1fr}.wide{grid-column:auto}.table-wrap{overflow:auto}table{min-width:720px}}</style></head><body><div class="wrap"><aside class="side"><div class="brand">PLB<small>피엘비 주식회사 관리자</small></div><nav class="nav"><a href="#dashboard">대시보드</a><a href="#products">제품 관리</a><a href="#documents">자료실</a><a href="#inquiries">문의 관리</a><a href="#backup">백업</a><a href="/">홈페이지</a></nav></aside><main><div class="top"><h1>관리자 대시보드</h1><a href="/">홈페이지 보기</a></div><div class="notice">현재 데이터는 이 브라우저에 저장됩니다. Supabase 연결 전에도 제품·자료·문의 관리 테스트가 가능합니다.</div><section class="stats" id="dashboard"><div class="card"><b id="productCount">0</b><span>등록 제품</span></div><div class="card"><b id="documentCount">0</b><span>등록 자료</span></div><div class="card"><b id="newInquiryCount">0</b><span>신규 문의</span></div><div class="card"><b>4</b><span>제조사</span></div></section><section class="panel" id="products"><h2>제품 등록</h2><form id="productForm"><label>제품명<input name="name" required></label><label>제조사<select name="maker"><option>KCC</option><option>삼화페인트</option><option>조광페인트</option><option>제비스코</option><option>기타</option></select></label><label>분류<select name="category"><option>산업용 페인트</option><option>분체도료</option><option>방청도료</option><option>기능성 코팅</option><option>기타</option></select></label><label>포장 단위<input name="package" placeholder="예: 20kg"></label><label class="wide">설명<textarea name="description"></textarea></label><div class="actions wide"><button class="btn" type="submit">제품 등록</button></div></form><div class="table-wrap"><table><thead><tr><th>제품명</th><th>제조사</th><th>분류</th><th>포장</th><th>설명</th><th>관리</th></tr></thead><tbody id="productRows"></tbody></table></div></section><section class="panel" id="documents"><h2>자료 등록</h2><form id="documentForm"><label>자료명<input name="title" required></label><label>종류<select name="type"><option>MSDS</option><option>TDS</option><option>카탈로그</option><option>인증서</option></select></label><label>제조사<select name="maker"><option>KCC</option><option>삼화페인트</option><option>조광페인트</option><option>제비스코</option><option>기타</option></select></label><label>자료 링크<input name="url" type="url" placeholder="https://"></label><div class="actions wide"><button class="btn" type="submit">자료 등록</button></div></form><div class="table-wrap"><table><thead><tr><th>자료명</th><th>종류</th><th>제조사</th><th>링크</th><th>관리</th></tr></thead><tbody id="documentRows"></tbody></table></div></section><section class="panel" id="inquiries"><h2>문의 관리</h2><div class="actions"><button class="btn secondary" id="sampleInquiry" type="button">테스트 문의 추가</button></div><div class="table-wrap"><table><thead><tr><th>회사명</th><th>담당자</th><th>연락처</th><th>제품</th><th>내용</th><th>상태</th><th>관리</th></tr></thead><tbody id="inquiryRows"></tbody></table></div></section><section class="panel" id="backup"><h2>데이터 백업</h2><p>현재 등록한 제품·자료·문의 데이터를 JSON 파일로 내려받을 수 있습니다.</p><div class="actions"><button class="btn" id="exportData" type="button">백업 다운로드</button><button class="btn secondary" id="clearData" type="button">전체 초기화</button></div></section></main></div><script src="app.js"></script></body></html>
